<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phố Mây · Tài liệu</title>
<!-- Trang đọc tài liệu Markdown trên GitHub Pages: md.html?f=GDD-Pho-May.md (file .md nằm cùng thư mục docs/) -->
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
  :root { --paper: #FFF8EC; --ink: #3B2A20; --soft: #7A6555; --line: #E3D3BC; --accent: #C4553F; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.65 system-ui, sans-serif; }
  nav { max-width: 860px; margin: 0 auto; padding: 16px 16px 0; font-size: 14px; }
  nav a { color: var(--accent); }
  main { max-width: 860px; margin: 0 auto; padding: 8px 16px 48px; overflow-wrap: anywhere; }
  h1, h2, h3 { line-height: 1.3; } h2 { margin-top: 2em; padding-bottom: .2em; border-bottom: 2px solid var(--line); }
  a { color: var(--accent); }
  table { border-collapse: collapse; display: block; overflow-x: auto; margin: 1em 0; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; vertical-align: top; }
  th { background: #F6EAD7; }
  code { background: #F3E6D2; padding: .1em .3em; border-radius: 4px; font-size: .92em; }
  pre { background: #F3E6D2; padding: 12px; border-radius: 8px; overflow-x: auto; } pre code { background: none; padding: 0; }
  blockquote { margin: 1em 0; padding: .2em 1em; border-left: 4px solid var(--line); color: var(--soft); }
  img { max-width: 100%; }
</style>
</head>
<body>
<nav><a href="../">← Phố Mây</a></nav>
<main id="doc"><p>Đang tải…</p></main>
<script>
  (async () => {
    const doc = document.getElementById('doc');
    const f = new URLSearchParams(location.search).get('f') || '';
    if (!/^[\w.-]+\.md$/.test(f)) { doc.textContent = 'Không tìm thấy tài liệu.'; return; }
    try {
      const r = await fetch(f); if (!r.ok) throw new Error(r.status);
      doc.innerHTML = DOMPurify.sanitize(marked.parse(await r.text()));
    } catch (e) { doc.textContent = 'Không tải được ' + f + '.'; return; }
    // tiêu đề có id giống GitHub để link #mục trong tài liệu chạy được
    for (const h of doc.querySelectorAll('h1, h2, h3, h4, h5, h6')) h.id = h.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s/g, '-');
    // link sang tài liệu .md khác cũng mở bằng trang này
    for (const a of doc.querySelectorAll('a[href]')) { const m = a.getAttribute('href').match(/^([\w.-]+\.md)(#.*)?$/); if (m) a.href = 'md.html?f=' + m[1] + (m[2] || ''); }
    const h1 = doc.querySelector('h1'); if (h1) document.title = h1.textContent + ' · Phố Mây';
    if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
  })();
</script>
</body>
</html>
